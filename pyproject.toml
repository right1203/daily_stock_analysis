[project]
name = "daily-stock-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # 핵심 의존성
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "sqlalchemy>=2.0.0",
    "schedule>=1.2.0",
    "exchange-calendars>=4.5.0",
    # 데이터 소스
    "yfinance>=0.2.0",
    "pykrx>=1.0.45",
    "setuptools>=70.0.0,<81",
    # 데이터 처리
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "json-repair>=0.55.1",
    # AI 분석
    "litellm>=1.80.10",
    "tiktoken>=0.8.0,<0.12.0",
    "openai>=1.0.0",
    "PyYAML>=6.0",
    # 검색 엔진
    "tavily-python>=0.3.0",
    "google-search-results>=2.4.0",
    # 네트워크 요청
    "requests>=2.31.0",
    "markdown2>=2.4.0",
    "imgkit>=1.2.0",
    "fake-useragent>=1.4.0",
    "httpx[socks]",
    # Discord 봇
    "discord.py>=2.0.0",
    # 웹 콘텐츠 추출
    "newspaper3k>=0.2.8",
    "lxml-html-clean",
    # FastAPI 웹 프레임워크
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "google-genai",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".git", "__pycache__", ".env", "venv", ".venv"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".env",
    "venv",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# E501: line too long (some lines intentionally exceed the limit)
# E203: whitespace before slice (conflicts with black)
# E402: module import not at top (sometimes env setup must run first)
ignore = ["E501", "E203", "E402"]

[tool.bandit]
exclude_dirs = ["tests", "test_*.py"]
skips = ["B101"]
